repos:
    - repo: local
      hooks:
          - id: emacs-startup
            name: Load full config headless
            language: system
            entry: >-
                emacs --batch \
                  --eval '(setq debug-on-error t)' \
                  -l early-init.el \
                  -l init.el \
                  --eval '(message "Config loaded OK")'
            pass_filenames: false # don't pass file names; load everything
            always_run: true
